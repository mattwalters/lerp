# The stock lerp.toml, as `lerp init` writes it into a repo's root (with the
# bypassPermissions grant accepted; init asks). Check the real one in: it is
# the pipeline everyone working on the repo runs, and it contains the
# permissions you grant the agents. Review it like code.
#
# This file is the opinion; the engine has none. Lerp does not know that
# planning comes before implementing: that order exists only in the
# `on_success` pointers below. Rewrite them into a different shape, or delete
# queues entirely, and no lerp code changes.
#
# Tickets enter by where a human puts them; that placement is the routing
# decision — there is no syntax for it here.
# A big feature is promoted into "Planning"; a small fix goes straight
# to "Implementing".

# Linear team keys this repo serves. One repo may serve several teams (the
# monorepo case); two repos may never claim the same team.
teams = ["LERP"]

# Commands that create and destroy a lane's workspace, run from the repo
# root. Lerp invokes them with a unique lane/run identity and otherwise knows
# nothing about what they do. Environment isolation — ports, databases,
# containers — is this repo's problem, solved here.
provision = 'git worktree add --detach "$LERP_WORKSPACE" HEAD'
dispose = 'git worktree remove --force "$LERP_WORKSPACE"'

# --------------------------------------------------------------------------
# Runner
# --------------------------------------------------------------------------

# Claude Code, headless. {{prompt}} carries the queue's prompt, {{session}} a
# UUID lerp generates so the run can later be resumed by `resume` below —
# which is what `eject` hands you when you want to take the wheel yourself.
#
# `--output-format stream-json --verbose` streams every event as a JSON line
# while the run is live. Without it, `claude -p` prints only the final result
# at exit, and the board's log tail stays empty for the whole run.
#
# PERMISSIONS: with `--permission-mode bypassPermissions`, the agent edits
# files and runs commands (git, gh, tests) without asking — using your full
# user account. The worktree that `provision` above builds is a tidiness
# boundary, not a security one: nothing stops the agent from reading
# ~/.ssh or writing outside its workspace. Without the flag, a headless run
# fails at the first tool it is not allowed to use, so the pipeline needs
# either this grant — made deliberately, in review, where this file lives —
# or an `--allowedTools` list you curate.
[runners.claude]
command = "claude -p {{prompt}} --session-id {{session}} --output-format stream-json --verbose --permission-mode bypassPermissions"
resume = "claude --resume {{session}}"

# The agent needs its own Linear access — lerp passes only the ticket
# identifier, never the ticket body, and stage artifacts (plan comments,
# review verdicts) are written by the agent, not by lerp. Configure the
# Linear MCP server in Claude Code before expecting these prompts to work.

# --------------------------------------------------------------------------
# Queues
# --------------------------------------------------------------------------
#
# Prompts are plain text: read them, argue with them, edit them. Each one
# names its ticket with {{ticket}}, tells the agent where durable decisions
# belong (Linear), and says how to escalate (move the ticket itself — lerp
# will not overrule an agent that moved its own ticket). A prompt may also
# reference its own queue's {{status}}, {{on_success}}, and {{on_failure}},
# expanded at run time — so the prose follows the configured statuses
# through any rename or remap.

[queues.plan]
status = "Planning"
runner = "claude"
on_success = "Plan Review"
on_failure = "Needs Attention"
prompt = """
You are planning {{ticket}}, nothing more. Do not write code.

Read {{ticket}} in Linear, read SCOPE.md and AGENTS.md if this repository has
them, and explore enough of the code to know what the change touches. Then
post a plan as a Linear comment on {{ticket}}: what you will change, which
files, and how you will know it worked.

If the ticket is too vague to plan, or big enough that it should be several
tickets, say so in a comment and move {{ticket}} to {{on_failure}} instead of
guessing.
"""

[queues.implement]
status = "Implementing"
runner = "claude"
on_success = "Agent Review"
on_failure = "Needs Attention"
prompt = """
Implement {{ticket}}. Establish the brief first, in this order: the newest
review comment on {{ticket}} that asks for changes and has not been answered
yet, if there is one — then address exactly what it raises and nothing else;
otherwise the plan comment; otherwise the ticket's description. All three are
real entry paths: a small fix routed straight here never had a plan, and a
ticket sent back after a review has a verdict to answer. A review whose
pull request already carries the commits answering it has been answered
already — the brief is then whatever sent {{ticket}} back this time.

A pull request for {{ticket}} may already exist; look with `gh`. If one does,
this is rework: add commits to its branch rather than starting again, and
never open a second pull request for the same ticket.

Your workspace is a fresh worktree sharing the operator's git directory,
detached at whatever their clone had checked out — so treat nothing already
in it as your base. Fetch from the remote and check out the ref you want,
detached: `git checkout <branch>` by name fails outright when another
worktree holds that branch, which is the ordinary case for a ticket a human
has just been reading. Push with `git push origin HEAD:<branch>`.

Make the tests and whatever this repository uses as its check pass before you
push. Open a pull request with `gh` if there is not one already.

The pull request is the artifact — do not paste diffs or transcripts into
Linear. If the brief turns out to be wrong or missing, move {{ticket}} to
{{on_failure}} and say why in a comment rather than inventing your own.
"""

[queues.review]
status = "Agent Review"
runner = "claude"
on_success = "In Review"
on_failure = "Needs Attention"
prompt = """
Review the pull request for {{ticket}} as a careful senior engineer.

Find it with `gh`, read the diff, and check it against the plan comment on
{{ticket}} and against this repository's own conventions. Post your verdict as
a Linear comment: what you checked, and anything real you found. Concrete
failure scenarios only — no style essays.

Do not merge, and do not fix the code yourself. If it needs changes, move
{{ticket}} to {{on_failure}} with your findings in the comment, so a human
can send the work back through implementation. A clean review leaves
{{ticket}} for a human to merge.
"""

# A status no queue watches is how this pipeline waits for a human: the
# ticket comes to rest there, still assigned to whoever claimed it, and shows
# up under "needs you" in the board — named by the status it is resting in.
#
# "Plan Review" is the first such gate. A plan is worth writing only if
# someone reads it, so a finished plan stops here instead of flowing straight
# into "Implementing". Read the plan comment and press `p` to promote the
# ticket: to "Implementing" to build it, back to "Planning" to re-plan,
# or to "Needs Attention" to let it sit — that promote is the approval.
# Work that needs no plan never enters "Planning" and never meets this gate —
# routing is placement.
#
# "In Review" is where work leaves the automated path: a ticket that
# lands there on success waits for a human to merge the pull request — and
# Linear's GitHub integration moves it to Done.
#
# "Needs Attention" is the same idea for failures: no queue watches it,
# so a ticket that lands there waits for you rather than being retried
# forever. It is also where a review that found something parks its verdict,
# and that is a loop rather than a dead end: promote the ticket back to
# "Implementing" and the next run reads the newest review comment as its
# brief and adds commits to the pull request that already exists.
