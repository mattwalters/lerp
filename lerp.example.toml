# The stock lerp.toml, as `lerp init` writes it into a repo's root (with the
# bypassPermissions grant accepted; init asks). Check the real one in: it is
# the pipeline everyone working on the repo runs, and it contains the
# permissions you grant the agents. Review it like code.
#
# This file is the opinion; the engine has none. Lerp does not know that
# planning comes before implementing: that order exists only in the
# `on_success` pointers below. Rewrite them into a different shape, or delete
# queues entirely, and no lerp code changes.
#
# Tickets enter by where a human puts them. A big feature is promoted into
# Planning; a small fix goes straight to Implementing. That placement is the
# routing decision — there is no syntax for it here.

# Linear team keys this repo serves. One repo may serve several teams (the
# monorepo case); two repos may never claim the same team.
teams = ["LERP"]

# Commands that create and destroy a lane's workspace, run from the repo
# root. Lerp invokes them with a unique lane/run identity and otherwise knows
# nothing about what they do. Environment isolation — ports, databases,
# containers — is this repo's problem, solved here.
provision = 'git worktree add --detach "$LERP_WORKSPACE" HEAD'
dispose = 'git worktree remove --force "$LERP_WORKSPACE"'

# --------------------------------------------------------------------------
# Runner
# --------------------------------------------------------------------------

# Claude Code, headless. {{prompt}} carries the queue's prompt, {{session}} a
# UUID lerp generates so the run can later be resumed by `resume` below —
# which is what `eject` hands you when you want to take the wheel yourself.
#
# PERMISSIONS: with `--permission-mode bypassPermissions`, the agent edits
# files and runs commands (git, gh, tests) without asking — using your full
# user account. The worktree that `provision` above builds is a tidiness
# boundary, not a security one: nothing stops the agent from reading
# ~/.ssh or writing outside its workspace. Without the flag, a headless run
# fails at the first tool it is not allowed to use, so the pipeline needs
# either this grant — made deliberately, in review, where this file lives —
# or an `--allowedTools` list you curate.
[runners.claude]
command = "claude -p {{prompt}} --session-id {{session}} --permission-mode bypassPermissions"
resume = "claude --resume {{session}}"

# The agent needs its own Linear access — lerp passes only the ticket
# identifier, never the ticket body, and stage artifacts (plan comments,
# review verdicts) are written by the agent, not by lerp. Configure the
# Linear MCP server in Claude Code before expecting these prompts to work.

# --------------------------------------------------------------------------
# Queues
# --------------------------------------------------------------------------
#
# Prompts are plain text: read them, argue with them, edit them. Each one
# names its ticket with {{ticket}}, tells the agent where durable decisions
# belong (Linear), and says how to escalate (move the ticket itself — lerp
# will not overrule an agent that moved its own ticket).

[queues.plan]
status = "Planning"
runner = "claude"
on_success = "Implementing"
on_failure = "Needs Attention"
prompt = """
You are planning {{ticket}}, nothing more. Do not write code.

Read {{ticket}} in Linear, read SCOPE.md and AGENTS.md if this repository has
them, and explore enough of the code to know what the change touches. Then
post a plan as a Linear comment on {{ticket}}: what you will change, which
files, and how you will know it worked.

If the ticket is too vague to plan, or big enough that it should be several
tickets, say so in a comment and move {{ticket}} to Needs Attention instead of
guessing.
"""

[queues.implement]
status = "Implementing"
runner = "claude"
on_success = "Agent Review"
on_failure = "Needs Attention"
prompt = """
Implement {{ticket}}, following the plan comment on it in Linear.

You are in a disposable workspace for this ticket alone. Work here, commit,
push a branch, and open a pull request with `gh`. Make the tests and whatever
this repository uses as its check pass before you open it.

The pull request is the artifact — do not paste diffs or transcripts into
Linear. If the plan turns out to be wrong or missing, move {{ticket}} to
Needs Attention and say why in a comment rather than inventing a new plan.
"""

[queues.review]
status = "Agent Review"
runner = "claude"
on_success = "In Review"
on_failure = "Needs Attention"
prompt = """
Review the pull request for {{ticket}} as a careful senior engineer.

Find it with `gh`, read the diff, and check it against the plan comment on
{{ticket}} and against this repository's own conventions. Post your verdict as
a Linear comment: what you checked, and anything real you found. Concrete
failure scenarios only — no style essays.

Do not merge, and do not fix the code yourself. If it needs changes, move
{{ticket}} back to Implementing with your findings in the comment; the next
run will pick it up from there. A clean review leaves {{ticket}} for a human
to merge.
"""

# On a clean review the ticket lands in "In Review" — a status no queue
# watches, which is how work leaves the automated path. A human merges the
# pull request, and Linear's GitHub integration moves the ticket to Done.
#
# "Needs Attention" is the same idea for failures: no queue watches it, so a
# ticket that lands there waits for you rather than being retried forever.
