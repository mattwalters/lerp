# The docs site, published to GitHub Pages by .github/workflows/docs.yml.
#
# The site root is the latest build — it tracks main, not the last release —
# and /latest/ is that same build published a second time so the version
# picker's own "latest" option has somewhere to point. Every release tag
# additionally freezes a copy under /vX.Y.Z/ that is never rebuilt.
#
# The layout is hand-rolled in layouts/ and one stylesheet: a sidebar, a
# reading column and a rail is the whole of it, and a theme module would be a
# pinned dependency (or, for Docsy, a Node toolchain) to render markdown this
# repo already has.

# Deliberately the bare domain, carrying neither the /lerp/ project path the
# site actually serves from nor a version subpath: with relativeURLs every
# emitted link is relative, so the same build serves correctly from any host
# and any directory — which is what a frozen /vX.Y.Z/ copy needs to still be
# true years from now, and what path-absolute asset URLs do not survive. (A
# baseURL with a subpath would also be mis-relativized by Hugo, which writes
# the subpath into the relative link.) CI passes no baseURL, so this value
# only ever serves the local preview.
baseURL = "https://mattwalters.github.io/"
title = "lerp"
relativeURLs = true

disableKinds = ["taxonomy", "term", "rss", "sitemap"]

[markup.highlight]
# Classes, not inline styles: no chroma stylesheet ships, so code renders on
# style.css's own block, which follows the reader's light/dark preference.
noClasses = false

[markup.goldmark.renderer]
# The published files are this repository's own markdown, written by the same
# people as the templates around them, so the handful of raw HTML tags they
# use — the <sub> caption under the README's cast — render rather than being
# dropped. Nothing here renders markdown from anywhere else.
unsafe = true

[markup.goldmark.parser]
# The README and SCOPE are read on GitHub too, and GitHub derives heading
# anchors this way. Keeping the same scheme keeps the in-page links those
# files already carry — #stock-pipeline, #how-it-behaves — resolving here.
autoHeadingIDType = "github"

[params]
# The version this build documents: CI sets HUGO_PARAMS_VERSION to the tag,
# or to "latest" for a build of main. "dev" means a local preview.
version = "dev"
# Where the directory holding every version — and versions.json with it — sits
# relative to this build. The copy published at the site root is at that
# directory already ("."); the /latest/ and /vX.Y.Z/ copies are one level below
# it, and CI sets HUGO_PARAMS_VERSIONROOT to ".." when it stages those. The
# depth cannot be guessed from the page's own URL: the root copy and the
# /latest/ copy are byte-identical builds published at different depths.
versionroot = "."
# Where render-link.html sends the repo files the site does not publish.
repo = "https://github.com/mattwalters/lerp"

# The sidebar, and with the header's one Docs link the site's whole
# navigation. It is curated rather than derived from the content tree: the
# order is editorial, and a page that is not listed here is unreachable by
# design — a half-written section can sit in the repo without being published
# to the front of the manual.
#
# `section` is the group heading an entry sits under. baseof.html emits one
# whenever the value changes as it walks this list in weight order, so a
# section's entries have to be contiguous in weight — hence the gaps, which
# leave room to insert a page without renumbering the ones after it.
#
# `mono` marks an entry whose name is a command, and sets it in the face you
# type it in. Nothing carries it yet; the first page named for a command will.

[[menus.main]]
name = "Overview"
pageRef = "/docs/overview"
weight = 10
[menus.main.params]
section = "Start"

# README.md and SCOPE.md are pages of the manual too — mounted below rather
# than rewritten, so there is no second copy of lerp's prose to drift out of
# sync with the first.
[[menus.main]]
name = "README"
pageRef = "/readme"
weight = 100
[menus.main.params]
section = "Reference"

[[menus.main]]
name = "SCOPE"
pageRef = "/scope"
weight = 110
[menus.main.params]
section = "Reference"

# README.md and SCOPE.md live at the repository root and are mounted into the
# site rather than copied: one source of truth, edited in the same PR as the
# code it describes. Declaring any content mount replaces Hugo's default, so
# content/ is mounted explicitly here too.
[[module.mounts]]
source = "content"
target = "content"

[[module.mounts]]
source = "../README.md"
target = "content/readme.md"

[[module.mounts]]
source = "../SCOPE.md"
target = "content/scope.md"

# The cast the README opens with, served at the path the README writes, so
# that one image reference resolves on GitHub and on the site alike.
[[module.mounts]]
source = "static"
target = "static"

[[module.mounts]]
source = "demo.gif"
target = "static/docs/demo.gif"

# Mounted files carry no front matter, so their titles are set here. Without
# this the site would title them from their filenames ("Readme").
[[cascade]]
title = "README"
[cascade.target]
path = "/readme"

[[cascade]]
title = "SCOPE"
[cascade.target]
path = "/scope"
