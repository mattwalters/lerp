# The docs site, published to GitHub Pages by .github/workflows/docs.yml.
#
# The manual — everything but the root — is versioned documentation and
# publishes only on a tag: /latest/ and /vX.Y.Z/ are both built from that
# tag's own tree, and neither is ever rebuilt from main. The root — the
# splash page and Why lerp — is marketing, stays unversioned, and keeps
# tracking main instead. One Hugo source builds both: a main push prunes the
# manual back out of its build before deploy, so root and manual are never
# byte-identical the way the root and /latest/ briefly were under the model
# this superseded.
#
# The layout is hand-rolled in layouts/ and one stylesheet: a sidebar, a
# reading column and a rail is the whole of it, and a theme module would be a
# pinned dependency (or, for Docsy, a Node toolchain) to render markdown this
# repo already has.

# The site's own domain, bare and with no version subpath. Nothing published
# is relativized against it: with relativeURLs every emitted link is relative,
# so the same build serves correctly from any host and any directory — which
# is what a frozen /vX.Y.Z/ copy needs to still be true years from now, and
# what path-absolute asset URLs do not survive. That is also what carries the
# builds cut before this line changed through the move itself: pages built for
# mattwalters.github.io/lerp/ serve from lerp.sh untouched, which is the whole
# reason the relative-links rule was worth its awkwardness. (A baseURL with a
# subpath would be mis-relativized by Hugo, which writes the subpath into the
# relative link.) CI passes no baseURL, so this value only ever serves the
# local preview.
baseURL = "https://lerp.sh/"
title = "lerp"
relativeURLs = true

disableKinds = ["taxonomy", "term", "rss", "sitemap"]

[markup.highlight]
# Classes, not inline styles: no chroma stylesheet ships, so code renders on
# style.css's own block, which follows the reader's light/dark preference.
noClasses = false

[markup.goldmark.renderer]
# The published files are this repository's own markdown, written by the same
# people as the templates around them, so the handful of raw HTML tags they
# use — the <sub> caption under the README's cast — render rather than being
# dropped. Nothing here renders markdown from anywhere else.
unsafe = true

[markup.goldmark.parser]
# The README and SCOPE are read on GitHub too, and GitHub derives heading
# anchors this way. Keeping the same scheme keeps the in-page links those
# files already carry — #stock-pipeline, #how-it-behaves — resolving here.
autoHeadingIDType = "github"

[params]
# The version label this build shows in the header: CI sets HUGO_PARAMS_VERSION
# to the tag for a /vX.Y.Z/ build, to "latest" for a /latest/ build, or leaves
# it empty for the unversioned root. "dev" means a local preview.
version = "dev"
# The git ref this build's content actually comes from — what render-link.html
# points an off-site file link at (a repo file the site does not publish, such
# as CONTRIBUTING.md). Distinct from version: a /latest/ build's version label
# is the string "latest", but its content and its off-site links both come
# from the release tag that cut it, never from main once that tag exists. CI
# sets HUGO_PARAMS_REF to the tag for both /latest/ and /vX.Y.Z/; the
# unversioned root leaves it at the default, because the root is main's tree.
ref = "main"
# Where the directory holding every version — and versions.json with it — sits
# relative to this build. The copy published at the site root is at that
# directory already ("."); the /latest/ and /vX.Y.Z/ copies are one level below
# it, and CI sets HUGO_PARAMS_VERSIONROOT to ".." when it stages those. The
# depth cannot be guessed from the page's own URL.
versionroot = "."
# Where render-link.html sends the repo files the site does not publish.
repo = "https://github.com/mattwalters/lerp"

# The sidebar, and with the header's one Docs link the site's whole
# navigation. It is curated rather than derived from the content tree: the
# grouping and the order are editorial, and a page that is not listed here
# does not appear in the sidebar. It is still published, and its section
# index still lists it (list.html reads the section's children) — a page that
# should not be published at all is `draft = true` in its own front matter,
# which is the only thing that keeps it out of a build. Its entry here comes
# out with it: an entry pointing at a page the build does not have fails the
# build, on purpose, rather than linking to nowhere.
#
# `section` is the group heading an entry sits under. baseof.html emits one
# whenever the value changes as it walks this list in weight order, so a
# section's entries have to be contiguous in weight — hence the gaps, which
# leave room to insert a page without renumbering the ones after it. An entry
# that omits `section` does not render ungrouped; it joins whatever group is
# above it, because nothing has changed the heading.
#
# `mono` marks an entry whose name is a command, and sets it in the face you
# type it in. Nothing carries it yet; the first page named for a command will.

# The section index leads its own section: standing on it, the sidebar shows
# where you are, which an entry-less landing page cannot.
[[menus.main]]
name = "Documentation"
pageRef = "/docs"
weight = 10
[menus.main.params]
section = "Start"

[[menus.main]]
name = "Overview"
pageRef = "/docs/overview"
weight = 20
[menus.main.params]
section = "Start"

# README.md and SCOPE.md are pages of the manual too — mounted below rather
# than rewritten, so there is no second copy of lerp's prose to drift out of
# sync with the first.
[[menus.main]]
name = "README"
pageRef = "/readme"
weight = 100
[menus.main.params]
section = "Reference"

[[menus.main]]
name = "SCOPE"
pageRef = "/scope"
weight = 110
[menus.main.params]
section = "Reference"

# README.md and SCOPE.md live at the repository root and are mounted into the
# site rather than copied: one source of truth, edited in the same PR as the
# code it describes. Declaring any content mount replaces Hugo's default, so
# content/ is mounted explicitly here too.
[[module.mounts]]
source = "content"
target = "content"

[[module.mounts]]
source = "../README.md"
target = "content/readme.md"

[[module.mounts]]
source = "../SCOPE.md"
target = "content/scope.md"

# The cast the README opens with, served at the path the README writes, so
# that one image reference resolves on GitHub and on the site alike.
[[module.mounts]]
source = "static"
target = "static"

[[module.mounts]]
source = "demo.gif"
target = "static/docs/demo.gif"

# Mounted files carry no front matter, so their titles are set here. Without
# this the site would title them from their filenames ("Readme").
[[cascade]]
title = "README"
[cascade.target]
path = "/readme"

[[cascade]]
title = "SCOPE"
[cascade.target]
path = "/scope"
