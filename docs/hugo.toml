# SCOPE.md is a page of the manual too — mounted below rather than rewritten,
# so there is no second copy of the fence to drift out of sync with the
# first. The README is not: since the manual took over what it used to carry,
# what is left of it is a front door — install, the cast, a pointer to here —
# and mounting that would put a second copy of this site's home page in the
# sidebar.
[[menus.main]]
name = "SCOPE"
pageRef = "/scope"
weight = 150
[menus.main.params]
section = "Reference"

# SCOPE.md lives at the repository root and is mounted into the site rather
# than copied: one source of truth, edited in the same PR as the code it
# describes. Declaring any content mount replaces Hugo's default, so content/
# is mounted explicitly here too.
[[module.mounts]]
source = "content"
target = "content"

[[module.mounts]]
source = "../SCOPE.md"
target = "content/scope.md"

# The cast the README and the home page both open with, served at the path
# the README writes, so that one image reference resolves on GitHub and on
# the site alike.
[[module.mounts]]
source = "static"
target = "static"

[[module.mounts]]
source = "demo.gif"
target = "static/docs/demo.gif"

# A mounted file carries no front matter, so its title and description are set
# here. Without this the site would title it from its filename ("Scope") and
# have no meta description for it.
[[cascade]]
title = "SCOPE"
description = "The fence around the project: five concepts, nine invariants, and the litmus tests every change runs through."
[cascade.target]
path = "/scope"
