# lerp.toml — this repository's lerp configuration, written by `lerp init`.
# Check this file in: it is the pipeline everyone working on this repo runs,
# and it contains the permissions you grant the agents. Review it like code.
#
# This file is the opinion; the engine has none. Lerp does not know that
# planning comes before implementing: that order exists only in the
# `on_success` pointers below. Rewrite them into a different shape, or delete
# queues entirely, and no lerp code changes.
#
# Tickets enter by where a human puts them; that placement is the routing
# decision — there is no syntax for it here.
# A big feature is promoted into "Planning"; a small fix goes straight
# to "Implementing".

# Linear team keys this repo serves. One repo may serve several teams (the
# monorepo case); two repos may never claim the same team.
teams = ["LERP"]

# Commands that create and destroy a lane's workspace, run from the repo
# root. Lerp invokes them with a unique lane/run identity and otherwise knows
# nothing about what they do. Environment isolation — ports, databases,
# containers — is this repo's problem, solved here.
provision = 'git worktree add --detach "$LERP_WORKSPACE" HEAD'
dispose = 'git worktree remove --force "$LERP_WORKSPACE"'

# --------------------------------------------------------------------------
# Runner
# --------------------------------------------------------------------------

# Two vendor kinds, on purpose, not one. This block used to write every
# stage's shell command out by hand; now each [runners.NAME] names a
# built-in adapter (SCOPE concept 3) and overrides its Model, Effort and
# Args — the adapter's own escape valve for a flag it doesn't model —
# instead of spelling out the CLI invocation. The adapter supplies Command
# and Resume; a vendor runner may not set `resume` itself (lerp refuses that
# config), because the adapter already knows its own vendor's shape. Resume
# is what `eject` hands you when you want to take the wheel yourself.
#
# Planning and merging run on the claude adapter, below. Implementing runs
# on the antigravity adapter (the agy CLI) instead — a live canary for the
# second vendor lerp ships, so a regression in that adapter's harness shows
# up on this board before it shows up in anyone else's repo. The codex
# adapter (LERP-137) sits out of this file for now, undogfooded; when it
# earns a slot here it is a queue where a vendor regression is cheap and
# visible, never the merge queue below, whose refusal clause is the part of
# this pipeline worth protecting most.
#
# PERMISSIONS: no adapter lerp ships ever adds a permission-skipping flag on
# its own — that grant reaches a command only by being written into a
# runner's own `args` line, checked in and reviewed like the rest of this
# file (see SECURITY.md). `--permission-mode bypassPermissions` below and
# `--dangerously-skip-permissions` on the antigravity runner further down
# mean the same thing for their own CLIs: the agent edits files and runs
# commands without asking, using your full user account. The worktree that
# `provision` above builds is a tidiness boundary, not a security one —
# nothing stops an agent from reading ~/.ssh or writing outside its
# workspace. Without the flag, a headless run fails at the first tool it is
# not allowed to use.
[runners.claude]
vendor = "claude"
model = "claude-opus-5"
effort = "high"
args = "--permission-mode bypassPermissions"

# The same adapter one notch down, for the merge queue below. That queue is
# mechanics by its own prompt — rebase, run the check, watch CI, press merge —
# and every judgment call in it is a refusal rather than a decision, so the
# capability it needs is the discipline to stop, not the reach to solve. Lower
# effort should if anything make that clause easier to honour: less appetite
# for treating a conflict as a puzzle. Planning stays on the runner above;
# implementing moves to a different vendor entirely, below.
[runners.claude-merge]
vendor = "claude"
model = "claude-sonnet-5"
effort = "medium"
args = "--permission-mode bypassPermissions"

# Implementing, moved off claude on purpose: this queue is the antigravity
# adapter's canary, the stage most worth running through a second vendor's
# harness under real load, since most implement runs execute a plan a human
# has already read and approved — comparatively mechanical work, and the
# one place a vendor regression is easiest to spot from the diff it leaves
# behind. gemini-3.7-flash-high is antigravity's cheap-hands tier at its
# highest reasoning effort — the same "thoroughness is still the whole job"
# bet the old claude-sonnet-5 pick made, translated to this CLI's own model
# names, which bake effort into the id rather than taking it as a separate
# flag.
#
# No reviewer roster rides along, and that is a capability gap rather than a
# choice: no adapter lerp ships, not even claude's own, models a flag like
# claude's raw `--agents` JSON — that only exists by writing a runner as
# `command` instead of `vendor`, which is what this repo's claude-implement
# runner used to do before this migration. Buying the roster back here would
# mean giving up the adapter's session bookkeeping (resume, eject) to regain
# one flag; instead this queue takes the plain shape, and the implement
# prompt below already tolerates that — "hand it to the reviewer agent if
# your runner provides one ... otherwise read it back yourself" — so a run
# here reviews its own diff instead of handing it up to a pinned reviewer.
# If that proves too little, the fix is a `command` runner here, or moving
# this queue back to claude.
[runners.antigravity-implement]
vendor = "antigravity"
model = "gemini-3.7-flash-high"
args = "--dangerously-skip-permissions"

# Each agent needs its own Linear access — lerp passes only the ticket
# identifier, never the ticket body, and stage artifacts (the plan in the
# ticket, the pull request, the note a run leaves behind) are written by the
# agent, not by lerp. Configure the Linear MCP server in whichever CLI a
# queue's runner names — Claude Code or Antigravity's own `agy mcp add` —
# before expecting these prompts to work. Lerp's own LINEAR_API_KEY is not a
# fallback: lerp drops it once it has read it, so nothing it starts inherits
# it. That is hygiene, not containment — a command that reaches a login
# shell, and a session you resume yourself with the command above, both pick
# the key back up from wherever you exported it.

# --------------------------------------------------------------------------
# Queues
# --------------------------------------------------------------------------
#
# Prompts are plain text: read them, argue with them, edit them. Each one
# names its ticket with {{ticket}}, tells the agent where durable decisions
# belong (Linear), and says how to escalate (move the ticket itself — lerp
# will not overrule an agent that moved its own ticket). A prompt may also
# reference its own queue's {{status}}, {{on_success}}, and {{on_failure}},
# expanded at run time — so the prose follows the configured statuses
# through any rename or remap.

[queues.plan]
status = "Planning"
runner = "claude"
on_success = "Plan Review"
on_failure = "Needs Attention"
prompt = """
You are planning {{ticket}}, nothing more. Do not write code.

Read {{ticket}} in Linear, read SCOPE.md and AGENTS.md if this repository has
them, and explore enough of the code to know what the change touches.

Write the plan into the ticket's own description, not into a comment: a
`## Plan` heading, then what you will change, which files, and how you will
know it worked. Open the section with a 2–4 sentence summary — what changes,
roughly where, and the one risk or open question worth knowing — that a
reviewer can approve or reject on before reading the detail below it. Leave
everything above that heading alone — it is what a human asked for. If the
description already has a `## Plan` section, replace that section and
nothing else. The description is the first thing the board shows, so the
plan reads as the ticket rather than as something filed under it, and
whoever meets it at "{{on_success}}" can edit it before promoting.

If the ticket is too vague to plan, or big enough that it should be several
tickets, say so in a comment and move {{ticket}} to {{on_failure}} instead of
guessing.
"""

[queues.implement]
status = "Implementing"
runner = "antigravity-implement"
on_success = "In Review"
on_failure = "Needs Attention"
prompt = """
Implement {{ticket}}. This run ends one of exactly two ways, and it is not
finished until it reaches one of them: a verdict comment on {{ticket}} and
the pull request marked ready for review, or {{ticket}} moved to
{{on_failure}} with a comment saying what stopped you, having never marked
the pull request ready. Nothing checks this for you: running out of prompt
with the pull request still a draft and {{ticket}} where it started leaves
it resting in "{{on_success}}" looking finished when it is not. Everything
below is how to get to one of those two endings.

Establish the brief first — the first of these that exists is the brief, and
the rest are not:

1. Unresolved review threads on the pull request for {{ticket}} that no later
   commit has answered, a human's before an agent's. Address exactly what
   they raise and nothing else, and reply to each thread saying what you did.
2. The newest comment on {{ticket}} asking for changes, if nothing since has
   answered it.
3. The ticket's description — its `## Plan` section if it has one, otherwise
   the whole of it.

All three are real entry paths: a small fix routed straight here never had a
plan, and a ticket sent back to this queue has something to answer. Work
whose pull request already carries the commits answering it has been answered
already; the brief is then whatever sent {{ticket}} back this time.

A pull request for {{ticket}} may already exist; look with `gh`. If one does,
this is rework: add commits to its branch rather than starting again, and
never open a second pull request for the same ticket.

Your workspace is a fresh worktree sharing the operator's git directory,
detached at whatever their clone had checked out — so treat nothing already
in it as your base. Fetch from the remote and check out the ref you want,
detached: `git checkout <branch>` by name fails outright when another
worktree holds that branch, which is the ordinary case for a ticket a human
has just been reading. Push with `git push origin HEAD:<branch>`.

Make the tests and whatever this repository uses as its check pass before you
push. If there is no pull request yet, open one as a draft
(`gh pr create --draft`). It stays a draft until the work is ready for a
human — which also keeps a pull-request automation on your Linear team from
moving {{ticket}} out from under this run while you are still working.

Title the pull request you open with {{ticket}}, a colon, and a short
description of the change. A pull request's number and its ticket's
identifier are unrelated numbers, and GitHub's pull request list, its
notifications and its review requests name a pull request by its number and
its title — so the title is where the identifier has to be.

Now review what you built, before a human has to. Read the diff with fresh
eyes: hand it to the reviewer agent if your runner provides one, or any
subagent that gets the brief and the diff and none of your reasoning;
otherwise read it back yourself. Check it against the brief and against this
repository's own conventions, and rate what you find high, medium or low.
Concrete failure scenarios only — no style essays.

Post the findings on the pull request, as review comments on the lines they
concern. Then fix them, push, and answer each thread. Review the result
again. Stop when a round turns up nothing high or medium, or after three
rounds — whichever comes first. A round that finds nothing is a good round;
do not invent work to justify one.

If three rounds leave something high or medium standing, this stops being
yours: leave the pull request as it stands and do not mark it ready, comment
on {{ticket}} with what is still wrong and what you tried, and move it to
{{on_failure}}.

When the work is ready for a human, leave one short comment on {{ticket}}
first: what changed, anything you know is still weak, and the pull request's
link.
Say in it how the review went, too — how many rounds you ran and what the
last one found. That is what makes it a verdict rather than a summary;
without it the comment reads exactly the same whether you reviewed or not,
and it is the only artifact Linear gets showing the review happened. The
findings themselves live on the pull request.
Only then mark the pull request ready for review (`gh pr ready`). That order
matters: the ready-flip is what lets a pull-request automation on your Linear
team move {{ticket}}, so the comment has to already be on it when that
happens. That comment is the verdict comment, and it is the whole of what
Linear gets — the pull request is the artifact, so never paste diffs or
transcripts into a ticket.

The board reads a ticket's comments into the main pane, so a ticket resting
in "{{on_success}}" with no verdict on it reads as unfinished at a glance,
without anyone opening the pull request to find out. Leaving one is not
optional.

If the brief turns out to be wrong or missing, move {{ticket}} to
{{on_failure}} and say why in a comment rather than inventing your own.
"""

# Dogfooding, and only here: this block is in *this* repository's config, not
# in the stock one lerp writes at init. Invariant 5's "a human merge" is still
# what ships. What is being tested is whether the refusal clause below holds
# under real conflicts; if it does for a few weeks, promoting this to the
# stock config is a separate ticket with its own SCOPE amendment.
#
# The gate at "In Review" used to bundle two things: the decision (this should
# land) and the mechanics (rebase, watch CI, resolve conflicts, click merge).
# The decision belongs on the board and stays there — a human reads the pull
# request and promotes the ticket here, and that promote is the merge
# approval. The mechanics are what this queue does. Nothing in the engine
# changed to allow it: a queue is a status with a prompt, and this is a third
# one.
[queues.merge]
status = "To Merge"
runner = "claude-merge"
on_success = "Done"
on_failure = "Needs Attention"
prompt = """
Merge the pull request for {{ticket}}. A human has already read it and
approved the merge by promoting the ticket here. What is left is mechanics —
up to date with the default branch, checks green, merged — and mechanics is
the whole of what you may do.

This run ends one of exactly two ways: the pull request merged, or
{{ticket}} moved to {{on_failure}} with a comment saying what stopped you.
There is no third ending where you stop quietly, and any step below that
meets something it has no instruction for takes the second one. Stopping
without either is the worst outcome available here: lerp applies the success
rule to a run that simply exits, so {{ticket}} would land in
"{{on_success}}" — a completed status, dropped from the inbox — with the
pull request still open and nothing anywhere saying the merge never
happened.

Find the pull request with `gh`: its number, its branch, its state. If
{{ticket}} has none, or its pull request is closed without having merged, or
it is still a draft — a draft is an implement run that never finished, so
what the human promoted was a pull request its own author had not marked
ready — there is nothing here to merge: say so in a comment and move
{{ticket}} to {{on_failure}}.

If it is already merged, this run has nothing to do: say so and stop,
without commenting and without touching the branch. That is the ordinary
shape of a re-run — nothing here is checkpointed, so a run killed anywhere
in this prompt is safe to start again from the top: killed mid-rebase it
redoes the rebase, and killed in the seconds after `gh pr merge` returns it
arrives here, with nothing left to do.

Your workspace is a fresh worktree sharing the operator's git directory,
detached at whatever their clone had checked out — most often their own copy
of main, never this pull request. Treat nothing already in it as your base:
fetch, check the pull request's head out detached with
`git checkout --detach origin/<branch>`, and keep the sha you got, which the
push below needs. `git checkout <branch>` by name fails outright when
another worktree holds that branch, which is the ordinary case for a ticket
a human has just been reading. Skip this step and everything after it still
appears to work: you would rebase the operator's main onto main, pass the
check, force that over the approved branch, and merge an empty diff.

Before merging, check with `gh` that the default branch is green — its
latest CI run against main's own head, not a required-checks setting: this
repository requires no checks of anybody, so asking after required ones
comes back empty and proves nothing. Green means a finished, successful run
against that exact head. One still going is not green yet, so wait for it,
and a head GitHub has no run for at all is not green either — read that as
red rather than reaching back to the previous head's run, which tested code
that is no longer what you would be merging onto. Merging onto a red main
buries somebody else's breakage inside your merge, where the next person to
look will find it attributed to this pull request. If main is red, do not
merge: comment on {{ticket}} saying so and move it to {{on_failure}}. Main
is not yours to fix from here.

Then bring the branch up to date with the default branch — rebase it, or
merge the default branch into it — and resolve the conflicts textually. Run
whatever this repository uses as its check. It has to pass before anything
merges, whether or not this run resolved a conflict to get there; a check
that comes back red is a stop and not something to fix — comment on
{{ticket}} with what failed, move it to {{on_failure}}, and leave the branch
where it is. What is in the workspace at that point is a resolution nobody
has read which does not even build, and the one place it cannot go is on top
of the commits a human approved.

Then push, with `git push origin HEAD:<branch>` — the branch is checked out
detached here, so the refspec is how the push names it. A rebase rewrites
the branch's commits, so that push comes back rejected as a
non-fast-forward. The answer is `--force-with-lease`, pinned to the sha you
checked the branch out at — `--force-with-lease=<branch>:<sha>` — and never
a plain `--force`. Pinned, because the unpinned form trusts your
remote-tracking ref, and every lane on this machine shares one git
directory: another run's `git fetch` moves `origin/<branch>` under you, and
the lease then measures against a value that already contains the push it
existed to protect. Nothing on this repo's branches stops a plain force
either, and what both mistakes throw away is whatever arrived while you were
rebasing — most likely a review fix a human pushed, which is the one thing
this queue must not lose.

Then merge, by number and by method: `gh pr merge <number> --squash`. The
number, because a detached HEAD gives `gh` no branch to infer it from; the
method, because this repository allows all three and `gh` will not pick one
for you outside a terminal — and squash is what this history is made of.
Merge only once the pull request's own checks are green against the head you
just pushed: your local check says the code is fine, these say that what
lands on main is. They will still be running when you get there, so watch
them with `gh pr checks <number> --watch` — by number for the same reason as
above. An answer of no checks reported is the window before GitHub has
attached runs to the head you just pushed; that is a look-again, not a
verdict. Red results are the verdict, and they are the second ending:
comment, move {{ticket}} to {{on_failure}}, and do not set about fixing them.
Auto-merge is not the shortcut it looks like — this repository has it
switched off, it returns without waiting for anything, and what it waits on
is required checks, which this repository has none of.

Linear's GitHub automation will usually move {{ticket}} to "{{on_success}}"
as the merge lands, a moment before this run would have; that race is
harmless, since both are taking it to the same place.

The refusal clause is the load-bearing part of this queue, and it is what
earns an agent the right to touch a branch a human has already approved:
anything that takes a judgment call is a hard stop, not a puzzle to solve.
Stop if two changes touch the same behaviour; if resolving means writing new
logic rather than choosing between two texts; if the tests fail after a
resolution that was textually clean; or if your resolution diff comes out
bigger than the conflict hunks it settles. On any of those, do not merge —
pushing the rebase you already made is fine, except where what stopped you
was the check going red, which the paragraph on running the check leaves
unpushed for the reason it gives — comment on {{ticket}} naming the files
and the two intents that collide, and move it to {{on_failure}}. If the push
you made carried a resolution you wrote, the comment has to say so and name
the files it touched: the branch now looks conflict-free, so whoever reads
the comment, agrees, and promotes the ticket back here would otherwise get a
second run that finds nothing left to resolve and merges your guess unread.
Never guess and merge. A merge you guessed at is code that nobody reviewed,
sitting inside two changes that each were.

Everything you write stays inside a conflict hunk. The diff a human approved
is the diff that lands: no drive-by fixes, no reformatting, no "while I was
in here". Work the branch needs beyond its conflicts is a judgment call, and
the paragraph above says what to do with one of those.
"""

# A status no queue watches is how this pipeline waits for a human: the
# ticket comes to rest there and shows up in the inbox — named by the status
# it is resting in. The run releases its claim on the way out, because the
# status is the gate; a claim left here would only strand the ticket the
# moment anyone moved it on.
#
# "Plan Review" is the first such gate. A plan is worth writing only if
# someone reads it, so a finished plan stops here instead of flowing straight
# into "Implementing". The plan is the ticket's description, so it is the
# first thing the board shows you: edit it where you disagree, then press `p` to
# promote the ticket — to "Implementing" to build it, back to
# "Planning" to re-plan, or to "Needs Attention" to let it sit. That
# promote is the approval. Work that needs no plan never enters "Planning"
# and never meets this gate — routing is placement.
#
# "In Review" is the second such gate, and in this repo it is now a reading
# gate rather than a merging one: a ticket that lands there waits for a human
# to read the pull request and decide. Approving is promoting it to
# "To Merge", where the merge queue above takes over the mechanics; promoting
# it back to "Implementing" with review threads on the pull request is the
# other answer. The decision stayed with the human — only the rebasing and
# the merge button moved.
#
# "Needs Attention" is the same idea for failures: no queue watches it,
# so a ticket that lands there waits for you rather than being retried
# forever.
#
# There is deliberately no queue for reviewing. Review is iteration, and
# iteration is not a decision — a review that ping-pongs across the board
# leaves a trail of hops nobody read, and nothing on a board can count them.
# So "Implementing" reviews and fixes its own work inside one run,
# where the round count is the agent's own context and costs the board
# nothing. What reaches "Needs Attention" from there is what three rounds
# could not settle: say what you want on the pull request, promote the ticket
# back to "Implementing", and the next run reads your threads as its brief.
#
# A merge refusal comes to rest in the same place and is read the same way.
# Its comment names what stopped it, and the promote that answers it goes to
# whichever status can act on that: back to "To Merge" once main is green
# again, back to "Implementing" when two changes really do collide.
