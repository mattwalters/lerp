name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Both platforms are load-bearing: development happens on macOS, and
    # `internal/evidence` shells out to `ps -o lstart=` and parses what comes
    # back — exactly where BSD and GNU disagree — while the process-group and
    # lock syscalls under it are platform-sensitive too. fail-fast is off
    # because "does it break on one OS or both" is the whole question a red
    # run here has to answer, and cancelling the sibling job hides it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The gate lives in the Makefile so CI and a developer's local run can
      # never drift apart.
      - run: make check

  # A dependency that turns out to be vulnerable should fail a build, not wait
  # to be noticed. This gates on reachability: govulncheck fails the job only
  # for advisories lerp's own code can reach, so a red run is something to act
  # on rather than a version number to argue with. The tradeoff is real and
  # deliberate — an advisory in a dependency lerp never calls is reported and
  # does not gate. Its own job, not a step in `make check`, because it needs
  # the network and the gate does not.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Deliberately not go.mod's `go 1.25` like the test job. govulncheck
          # scans the standard library too, and it reports against whichever
          # toolchain runs it: pinned to an old line, this job goes red for
          # stdlib advisories whose fix only ever ships in a newer one, and no
          # change to this repo can clear it. `stable` asks the question worth
          # asking — is lerp exposed when built with a current Go — and
          # check-latest keeps the answer off the runner image's cache, which
          # lags upstream by days after a security release.
          go-version: stable
          check-latest: true
      # Pinned, and bumped by hand. The vulnerability database is fetched from
      # vuln.go.dev at run time, so a pinned scanner still sees today's
      # advisories; what the pin buys is that a new govulncheck release cannot
      # turn an unrelated PR red on its own.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  # The cast rots silently: a tape whose keystrokes no longer drive the UI
  # they were written against still renders, it just renders the wrong thing.
  # This job re-records it and checks the exit code — nothing diffs the bytes,
  # because GIF output is not reproducible enough to compare and what is worth
  # knowing is only whether the script still drives lerp.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # With no `path`, the action installs vhs and its ttyd/ffmpeg
      # dependencies and stops there, so the render itself stays `make demo` —
      # the same command a local re-record runs.
      - uses: charmbracelet/vhs-action@v2
      - run: make demo
