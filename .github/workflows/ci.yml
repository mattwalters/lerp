name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Both platforms are load-bearing: development happens on macOS, and
    # `internal/evidence` shells out to `ps -o lstart=` and parses what comes
    # back — exactly where BSD and GNU disagree — while the process-group and
    # lock syscalls under it are platform-sensitive too. fail-fast is off
    # because "does it break on one OS or both" is the whole question a red
    # run here has to answer, and cancelling the sibling job hides it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          # setup-go caches GOCACHE by default, and Go's test-result cache
          # lives there: a package whose inputs have not changed reports `ok
          # (cached)` without running. That is fine on a machine, and wrong
          # here, because the cache key has no runner-image component. The
          # inputs Go tracks do not include what `ps -o lstart=` printed, so a
          # macos-latest that rolls to an image whose BSD `ps` formats
          # differently would replay the previous image's pass and stay green
          # over the exact break the matrix exists to catch.
          cache: false
      # The gate lives in the Makefile so CI and a developer's local run can
      # never drift apart.
      - run: make check

  # A dependency that turns out to be vulnerable should fail a build, not wait
  # to be noticed. This gates on reachability: govulncheck fails the job only
  # for advisories lerp's own code can reach, so a red run is something to act
  # on rather than a version number to argue with. The tradeoff is real and
  # deliberate — an advisory in a dependency lerp never calls is printed and
  # does not gate, and Dependabot, not this job, is what carries those off the
  # tree. Its own job, not a step in `make check`, because it queries a
  # database over the network on every single run — where the gate reaches
  # the network only to fill a cold module cache, and never again.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Deliberately not go.mod's `go 1.25` like the test job. govulncheck
          # scans the standard library too, and it reports against whichever
          # toolchain runs it: held to an old release line, this job goes red
          # for stdlib advisories whose fix only ever ships in a newer one, and
          # no change to this repo can clear it. `stable` asks the question
          # worth asking — is lerp exposed when built with a current Go.
          go-version: stable
      # The toolchain above and the database it queries at run time float on
      # purpose, but the scanner itself is pinned: `go run ...@latest` builds
      # whatever upstream published most recently on every CI run, trading
      # arbitrary-code drift for freshness. Pin to a version and let
      # Dependabot or a scheduled bump do the floating.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  # Defense in depth behind GitHub's push protection, which is already enabled
  # and catches the main case before a push lands. What gitleaks adds over it:
  # rules GitHub does not carry (including Linear API keys) and a check that
  # fails the build on any leak detected. On pull requests it scans only the
  # incoming commit range; on pushes to main it scans full history by setting
  # GITHUB_EVENT_NAME to schedule. fetch-depth: 0 ensures the commit graph is
  # available for range resolution.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name == 'push' && 'schedule' || github.event_name }}

  # `.goreleaser.yaml` is otherwise executed exactly once in anger — by
  # release.yml, on a tag push, which is to say *after* the one step in the
  # Makefile that cannot be undone. A config error, a schema rule a later
  # goreleaser tightens, or a dependency bump that quietly needs cgo would all
  # surface there: tag already on origin, no release attached, and the next
  # version number burnt. The four cross-builds themselves take seconds; the
  # job around them — depth-0 checkout, setup-go, installing goreleaser, then
  # archives and checksums — is closer to a minute per PR. Worth paying, to
  # ask the question here where the answer is only a red PR.
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # goreleaser reads tag history to work out a version, and warns its
          # way through a shallow clone. Same depth release.yml uses, so this
          # job builds under the same conditions the real one does.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # install-only, for the reason demo.yml installs vhs and stops: what
      # runs is `make snapshot`, the same command a developer runs, so the two
      # cannot drift.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          install-only: true
      # Cheap and specific: `check` fails on a config the running goreleaser
      # will not accept, and says which key, where `release` would fail on it
      # halfway through a build.
      - run: goreleaser check
      - run: make snapshot
