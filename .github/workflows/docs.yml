# The docs site on GitHub Pages.
#
# Two kinds of page, two triggers. The manual is versioned documentation and
# publishes only on tags: /latest/ and /vX.Y.Z/ are both built from the tag's
# own tree and neither is ever rebuilt from main, so a repo pinned to lerp
# vX.Y.Z — and `go install …@latest`, which resolves to the last tag, not
# main — can always read docs that match the binary. The root — the splash
# page and Why lerp — is marketing, not documentation: it keeps tracking
# main, rebuilding on every push, because nothing there describes a version
# and nothing there should wait for a release to change.
#
# One Hugo source, staged twice rather than built twice: a main push runs the
# whole site through Hugo once and then prunes the manual pages back out
# before deploy, since the templates and content that shape are the same
# for both destinations. The tag build appends to versions.json, the same
# manifest the root's own picker reads.
#
# One-time setup, in this order: merging this workflow lets its first run of
# main create the gh-pages branch, and Pages is then pointed at that branch by
# hand (Settings → Pages). Until that second act the site builds and deploys
# to a branch nobody serves.
#
# One-time cleanup, the first time this version of the workflow runs: earlier
# deploys, from before the root and the manual split, already put the manual
# at the site root (gh-pages:/docs/, /readme/, /scope/). Pruning it from the
# stage keep_files does not retroactively delete what an older deploy already
# published — those three directories go on being served, unversioned and
# frozen at whatever main was on the last pre-split deploy, until someone
# removes them from gh-pages by hand. /latest/ is a separate, harmless case
# of the same fact: it stays exactly as an old main-tracking deploy left it,
# which is fine, because the first tag overwrites it with a correct copy.
#
# The custom domain is two more switches, both a human's and neither of them
# in this repository:
#
#   1. At the registrar, point lerp.sh at GitHub Pages: four A records on the
#      apex — 185.199.108.153, 185.199.109.153, 185.199.110.153 and
#      185.199.111.153 — or, on a registrar that flattens the apex, one
#      ALIAS/ANAME to mattwalters.github.io.
#   2. In Settings → Pages, set the custom domain to lerp.sh, and tick
#      Enforce HTTPS once the certificate has been issued. GitHub then serves
#      the old mattwalters.github.io/lerp/ URL as a redirect to it.
#
# Flipped once. The deploy step re-asserts the CNAME file every run, so no
# later deploy can take the domain back down.
name: docs

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    paths:
      # The site is the repo's own markdown, so a README or SCOPE edit is a
      # content change and gets the same build gate as a template edit. The
      # Makefile is here because it holds the Hugo pin both jobs read.
      - "docs/**"
      - "README.md"
      - "SCOPE.md"
      - "Makefile"
      - ".github/workflows/docs.yml"
  # A republish of the root without a commit to push — after enabling Pages,
  # say. This cannot touch /latest/: dispatch is a distinct event from push,
  # so it never satisfies the tag build's condition below. Republishing
  # /latest/ without cutting a new tag means re-running that tag's own
  # workflow run (Actions → the run → Re-run jobs), not dispatching this one.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A PR proves the site still builds. Nothing is deployed.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: pin
        # Assigned first, so a make that fails takes the step down with it:
        # inside printf's arguments its exit status is discarded, and the
        # empty input that follows fails two steps later on a download URL
        # that says nothing about the pin.
        run: |
          version="$(make -s hugo-version)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.pin.outputs.version }}
      # HUGO_PARAMS_VERSION explicitly empty, matching the root build below:
      # left unset this would default to hugo.toml's "dev" and never equal
      # "", so the root's own template branch (baseof.html's $unversionedRoot)
      # would go untested here and get its first real run on the publish that
      # follows a merge.
      - run: hugo --source docs --destination "$PWD/public"
        env:
          HUGO_PARAMS_VERSION: ""
      # The other shape the templates take: a versioned build, which stamps
      # a version, links into that tag on GitHub and looks a directory
      # further up for the manifest. /latest/ and /vX.Y.Z/ both take this
      # shape, and both otherwise only run on a tag push — a run that cannot
      # be repeated without moving the tag, so this is the only gate either
      # of them gets against a broken template.
      - run: hugo --source docs --destination "$PWD/public-frozen"
        env:
          HUGO_PARAMS_VERSION: v0.0.0
          HUGO_PARAMS_VERSIONROOT: ".."
          HUGO_PARAMS_REF: v0.0.0

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Each run clones gh-pages, stages onto it and pushes, so two overlapping
    # publishes race and the loser's push is rejected. Grouped per ref rather
    # than globally, because GitHub cancels a *pending* run when a newer one
    # joins its group, whatever cancel-in-progress says: one shared group
    # would let a second merge to main cancel the queued tag run, and the
    # frozen copy and manifest entry that run carries are what nobody can
    # re-cut. Two pushes to main superseding each other is harmless — the
    # newer one publishes newer content — and a tag, in a group of its own,
    # is never superseded. What is left is a tag and a main run pushing at
    # the same moment: that fails the job loudly and re-runs cleanly.
    concurrency:
      group: docs-publish-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7
      - id: pin
        # Assigned first, so a make that fails takes the step down with it:
        # inside printf's arguments its exit status is discarded, and the
        # empty input that follows fails two steps later on a download URL
        # that says nothing about the pin.
        run: |
          version="$(make -s hugo-version)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ steps.pin.outputs.version }}

      # No baseURL is passed to any of these builds: every emitted link is
      # relative (see docs/hugo.toml), so the same pages serve from any host
      # and any directory, and only the stamped version label differs between
      # them. Root and manual are built by different runs of this job now —
      # a main push builds only the root, a tag push only the manual — so
      # unlike before, at most one of the two ever runs in the same
      # execution; neither stages inside the other.
      #
      # Only from main, because the root is marketing, not a version: it
      # tracks main's HEAD the same way any other page describing the
      # project's current state would. A tag is a commit main may already
      # have moved past, so rebuilding the root from the tag's tree would
      # roll the homepage back. The ref is tested rather than the ref type
      # because workflow_dispatch is not subject to the branch filter on the
      # trigger — its ref dropdown lists every branch that carries this
      # file, and a dispatch left pointing at a spike branch would publish
      # that branch as the homepage.
      - name: Build root
        if: github.ref == 'refs/heads/main'
        run: hugo --source docs --destination "$PWD/public"
        env:
          # Empty, not "latest": the root is unversioned. Stamping it
          # "latest" would say it is a copy of the manual, which after the
          # prune step below it no longer is.
          HUGO_PARAMS_VERSION: ""

      # The root build above is the whole site — home, Why lerp, and the
      # manual alike, because there is one Hugo source and one set of
      # templates, not two builds to keep in sync. This step keeps only the
      # root pages, named explicitly, and deletes everything else, rather
      # than naming the manual's pages to delete: the manual grows on its own
      # (a new docs/content/docs/<page>.md, another root-file mount alongside
      # README and SCOPE) while the root does not, so a keep-list of what's
      # small and fixed stays correct where a prune-list of what's open-ended
      # would silently fall behind and let the next addition onto the manual
      # leak onto the unversioned root instead. docs/demo.gif is kept
      # alongside the two root pages though it lives under the manual's own
      # mount (see hugo.toml): the splash page embeds it too, at the same
      # path GitHub renders it from in the README, so it has to stay.
      - name: Stage only the root from the root build
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir /tmp/root
          mv public/index.html public/why public/style.css public/docs/demo.gif /tmp/root/
          rm -rf public
          mkdir -p public/docs
          mv /tmp/root/index.html /tmp/root/why /tmp/root/style.css public/
          mv /tmp/root/demo.gif public/docs/

      # Casts are rendered from the tag's own tree, same as the manual below,
      # so a recording always shows the released binary rather than whatever
      # merged last. Ahead of the Hugo builds: hugo.toml already mounts
      # docs/static into every build's static/, so a build that runs after
      # this step picks up docs/static/casts/ for free and needs no copy of
      # its own. workflow_dispatch cannot reach this step either, for the
      # same reason it cannot reach the manual builds below.
      - name: Set up Go
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # install-only, same as demo.yml: the render itself stays `make casts`,
      # the same command a local re-record runs.
      - uses: charmbracelet/vhs-action@v2
        if: github.event_name == 'push' && github.ref_type == 'tag'
      - name: Render casts
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: make casts

      # The root is marketing and tracks main (see "Build root" above), so it
      # never runs a Hugo build on this tag push to pick casts up from a
      # mount. This is the last release's recordings, staged at the site
      # root directly — a plain copy, not a build — so the splash page plays
      # them too. keep_files preserves it between tags: a push to main stages
      # nothing at public/casts (main renders no casts of its own), so it
      # goes on serving whatever the last tag put here. Before the first tag
      # this step has not run yet and the root has no casts at all; deciding
      # what the splash page does about that is LERP-132's call, not this
      # one's.
      - name: Stage this release's casts at the site root
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          mkdir -p public/casts
          cp -r docs/static/casts/. public/casts/

      # The manual publishes only from a tag, from that tag's own tree —
      # never from main, which is what keeps a manual that ships with an
      # installable binary from describing code the binary doesn't have.
      # workflow_dispatch cannot reach these two steps (it is not a push),
      # so replaying /latest/ or a frozen version without cutting a new tag
      # means re-running that tag's own workflow run, not dispatching this
      # one.
      #
      # A level below where the root's version directories used to live, so
      # the version picker's manifest — and the other versions it points at
      # — are one directory up from this copy, same as every frozen version.
      # HUGO_PARAMS_REF is the tag, not "latest": the version label is what
      # the header shows, but off-site links (render-link.html, for a repo
      # file the site does not publish, like CONTRIBUTING.md) need the real
      # ref this tree came from, or they'd point at whatever main has moved
      # on to since.
      - name: Build latest
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: hugo --source docs --destination "$PWD/public/latest"
        env:
          HUGO_PARAMS_VERSION: latest
          HUGO_PARAMS_VERSIONROOT: ".."
          HUGO_PARAMS_REF: ${{ github.ref_name }}

      # The frozen copy this tag owns forever, published alongside /latest/
      # in the same run: the release that moves /latest/ forward is the same
      # release that needs a permanent copy of what it moved away from.
      - name: Build ${{ github.ref_name }}
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: hugo --source docs --destination "$PWD/public/$GITHUB_REF_NAME"
        env:
          HUGO_PARAMS_VERSION: ${{ github.ref_name }}
          HUGO_PARAMS_VERSIONROOT: ".."
          HUGO_PARAMS_REF: ${{ github.ref_name }}

      # The manifest behind the version picker: this tag appended to whatever
      # gh-pages already carries, deduplicated and sorted newest first. The
      # first release finds no branch and starts from []. Every other run
      # skips this step — keep_files leaves the existing manifest in place.
      - name: Update versions.json
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          # Only a branch that genuinely is not there yet starts from []. A
          # fetch that failed for any other reason — a blip, an auth failure —
          # must not be read as an empty manifest: this step stages the file
          # the deploy publishes, so keep_files does not protect the versions
          # already listed in it, and a truncated manifest strands every
          # release before this one behind a picker that no longer lists it.
          status=0
          git ls-remote --exit-code --heads origin gh-pages >/dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch origin gh-pages --depth=1
            # The branch can exist without a manifest: every deploy before
            # the first tag publishes the site without writing one.
            git show FETCH_HEAD:versions.json > versions.json || echo "[]" > versions.json
          elif [ "$status" -eq 2 ]; then
            echo "[]" > versions.json
          else
            echo "gh-pages lookup failed (exit $status) — refusing to publish a manifest built from nothing"
            exit 1
          fi
          # Sorted on the numbers, with a release ranked above the
          # prereleases leading to it: the tag glob matches v1.0.0-rc1, and
          # both tonumber? (which keeps an unparseable segment from failing
          # the deploy) and a plain numeric key would tie it with v1.0.0 and
          # leave the picker to list them in whichever order it liked.
          jq --arg v "$GITHUB_REF_NAME" \
            '. + [$v] | unique | sort_by(
               (ltrimstr("v") | split("-")) as $p
               | ($p[0] | split(".") | map(tonumber? // 0))
                 + [if ($p | length) > 1 then 0 else 1 end]
             ) | reverse' \
            versions.json > public/versions.json
          cat public/versions.json

      # keep_files is the point: a deploy adds or overwrites only what it
      # staged — the (pruned) root on a main push, or /latest/, /vX.Y.Z/ and
      # versions.json on a tag push — while everything else already on
      # gh-pages, including every previously released version's directory,
      # stays exactly where it was. The same property in the other
      # direction: nothing published this way ever sheds a page on its own —
      # the root, and /latest/ no less than a frozen /vX.Y.Z/ — so a deleted
      # or renamed content file goes on being served from its subtree's last
      # build until someone removes it from the branch by hand.
      #
      # Nothing staged means nothing to publish: a run whose builds all
      # skipped — a dispatch pointed at neither main nor a tag push — stops
      # here rather than failing on a publish_dir that was never created.
      #
      # cname is the custom domain, written into gh-pages as a CNAME file on
      # every deploy. That file is not in this repository — GitHub creates it
      # when the domain is set by hand in Settings → Pages — so without this
      # line it survives only because keep_files leaves alone what a deploy
      # did not stage, and the domain would be one `keep_files: false` away
      # from vanishing with no diff here to explain it. Re-asserted, it is a
      # property of this workflow instead. It has to match what Settings →
      # Pages says; they are one setting with two spellings, and this is the
      # one a deploy can overwrite.
      - name: Deploy
        if: hashFiles('public/**') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
          cname: lerp.sh
